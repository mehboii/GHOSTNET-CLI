name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ghostnet-win32-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ghostnet-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: ghostnet-linux-arm64
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ghostnet-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ghostnet-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/ghostnet" "${{ matrix.asset }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy "target\${{ matrix.target }}\release\ghostnet.exe" "${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset }}
